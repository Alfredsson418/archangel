services:
  web:
    build:
      context: ./app/web
    network_mode: host
    environment:
      WEB_HOST: 127.0.0.1
      WEB_PORT: "5000"
      WEB_WORKERS: "1"
      ARCHANGEL_API_URL: http://127.0.0.1:8080
      ARCHANGEL_WEB_CONFIG: /data/web.json
    volumes:
      - archangel-web-config:/data
    restart: unless-stopped

volumes:
  archangel-web-config:
